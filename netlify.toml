[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# The old address forwards to the new one, path included (share links keep
# their key: the part after "#" survives a redirect).
[[redirects]]
  from = "https://scratchpadx.netlify.app/*"
  to = "https://scratch.sector809labs.com/:splat"
  status = 301
  force = true

# Share links: /s/<token> opens the viewer page; never indexed, and the link
# isn't passed on to other sites.
[[redirects]]
  from = "/s/*"
  to = "/share.html"
  status = 200

[[headers]]
  for = "/s/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/share.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"
