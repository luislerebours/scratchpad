<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <meta name="theme-color" content="#f5f1eb" />
  <script src="/theme.js"></script>
  <title>Shared with ScrapSheet</title>
  <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg?v=3" />
  <link rel="icon" type="image/png" href="/assets/favicon.png?v=3" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png?v=5" />
  <link rel="stylesheet" href="/styles.css" />
  <link rel="stylesheet" href="/share.css" />
</head>
<body class="share-page">
  <main class="share-shell">
    <header class="share-top">
      <a class="share-brand" href="/">
        <img class="mark-dark" data-mark src="/assets/mark.png?v=3" alt="" width="28" height="28" />
        <img class="mark-light" data-mark src="/assets/mark-light.png?v=3" alt="" width="28" height="28" />
        <span>ScrapSheet</span>
      </a>
    </header>
    <section id="shareCard" class="share-card" aria-live="polite">
      <p class="share-loading">Opening…</p>
    </section>
    <p class="share-foot">
      <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4.5 4.5 0 0 0 6.4 0l3-3a4.5 4.5 0 0 0-6.4-6.4l-1.2 1.2M14 10a4.5 4.5 0 0 0-6.4 0l-3 3a4.5 4.5 0 0 0 6.4 6.4l1.2-1.2"/></svg>
      <span id="shareFootText">Anyone with this link can view and download what's here until it expires.</span>
    </p>
  </main>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/share.js"></script>
</body>
</html>
